services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
        - NEXT_PUBLIC_WHATSAPP=${NEXT_PUBLIC_WHATSAPP}
        - NEXT_PUBLIC_CONTACT_EMAIL=${NEXT_PUBLIC_CONTACT_EMAIL}
        - NEXT_PUBLIC_PHONE=${NEXT_PUBLIC_PHONE}
    container_name: hayexperiencia-web
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"
    env_file:
      - .env
    networks:
      coolify:
        aliases:
          - hayexperiencia-web
    volumes:
      - /data/coolify/applications/hhc1afp29any1kulfucplz13/media:/app/media
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.http-0-hhc1afp29any1kulfucplz13.entryPoints=http
      - traefik.http.routers.http-0-hhc1afp29any1kulfucplz13.middlewares=redirect-to-https
      - "traefik.http.routers.http-0-hhc1afp29any1kulfucplz13.rule=Host(`hayexperiencia.com`) && PathPrefix(`/`)"
      - traefik.http.routers.http-0-hhc1afp29any1kulfucplz13.service=http-0-hhc1afp29any1kulfucplz13
      - traefik.http.routers.http-1-hhc1afp29any1kulfucplz13.entryPoints=http
      - traefik.http.routers.http-1-hhc1afp29any1kulfucplz13.middlewares=redirect-to-https
      - "traefik.http.routers.http-1-hhc1afp29any1kulfucplz13.rule=Host(`www.hayexperiencia.com`) && PathPrefix(`/`)"
      - traefik.http.routers.http-1-hhc1afp29any1kulfucplz13.service=http-1-hhc1afp29any1kulfucplz13
      - traefik.http.routers.https-0-hhc1afp29any1kulfucplz13.entryPoints=https
      - traefik.http.routers.https-0-hhc1afp29any1kulfucplz13.middlewares=gzip
      - "traefik.http.routers.https-0-hhc1afp29any1kulfucplz13.rule=Host(`hayexperiencia.com`) && PathPrefix(`/`)"
      - traefik.http.routers.https-0-hhc1afp29any1kulfucplz13.service=https-0-hhc1afp29any1kulfucplz13
      - traefik.http.routers.https-0-hhc1afp29any1kulfucplz13.tls.certresolver=letsencrypt
      - traefik.http.routers.https-0-hhc1afp29any1kulfucplz13.tls=true
      - traefik.http.routers.https-1-hhc1afp29any1kulfucplz13.entryPoints=https
      - traefik.http.routers.https-1-hhc1afp29any1kulfucplz13.middlewares=gzip
      - "traefik.http.routers.https-1-hhc1afp29any1kulfucplz13.rule=Host(`www.hayexperiencia.com`) && PathPrefix(`/`)"
      - traefik.http.routers.https-1-hhc1afp29any1kulfucplz13.service=https-1-hhc1afp29any1kulfucplz13
      - traefik.http.routers.https-1-hhc1afp29any1kulfucplz13.tls.certresolver=letsencrypt
      - traefik.http.routers.https-1-hhc1afp29any1kulfucplz13.tls=true
      - traefik.http.services.http-0-hhc1afp29any1kulfucplz13.loadbalancer.server.port=3000
      - traefik.http.services.http-1-hhc1afp29any1kulfucplz13.loadbalancer.server.port=3000
      - traefik.http.services.https-0-hhc1afp29any1kulfucplz13.loadbalancer.server.port=3000
      - traefik.http.services.https-1-hhc1afp29any1kulfucplz13.loadbalancer.server.port=3000
      # Intranet: las PÁGINAS /admin pasan por el login único (Authelia forward-auth) que
      # inyecta Remote-Email → el admin auto-loguea sin pedir contraseña. Solo /admin (no
      # /api/admin, que sigue con x-admin-key para Harry/scripts). Prioridad > catch-all.
      - traefik.http.routers.https-admin-hhc1afp29any1kulfucplz13.entryPoints=https
      - "traefik.http.routers.https-admin-hhc1afp29any1kulfucplz13.rule=Host(`hayexperiencia.com`) && PathPrefix(`/admin`)"
      - traefik.http.routers.https-admin-hhc1afp29any1kulfucplz13.priority=100
      - traefik.http.routers.https-admin-hhc1afp29any1kulfucplz13.middlewares=gzip,authelia@docker
      - traefik.http.routers.https-admin-hhc1afp29any1kulfucplz13.service=https-0-hhc1afp29any1kulfucplz13
      - traefik.http.routers.https-admin-hhc1afp29any1kulfucplz13.tls.certresolver=letsencrypt
      - traefik.http.routers.https-admin-hhc1afp29any1kulfucplz13.tls=true
      # arka11.co + www -> 301 a hayexperiencia.com/aluna (consolidacion SEO del dominio de Arka11).
      # Append-only: no toca los routers de hayexperiencia.com.
      - traefik.http.middlewares.arka-to-aluna.redirectregex.regex=.*
      - traefik.http.middlewares.arka-to-aluna.redirectregex.replacement=https://hayexperiencia.com/aluna
      - traefik.http.middlewares.arka-to-aluna.redirectregex.permanent=true
      - traefik.http.routers.http-2-hhc1afp29any1kulfucplz13.entryPoints=http
      - traefik.http.routers.http-2-hhc1afp29any1kulfucplz13.middlewares=redirect-to-https
      - "traefik.http.routers.http-2-hhc1afp29any1kulfucplz13.rule=Host(`arka11.co`) && PathPrefix(`/`)"
      - traefik.http.routers.http-2-hhc1afp29any1kulfucplz13.service=http-2-hhc1afp29any1kulfucplz13
      - traefik.http.routers.http-3-hhc1afp29any1kulfucplz13.entryPoints=http
      - traefik.http.routers.http-3-hhc1afp29any1kulfucplz13.middlewares=redirect-to-https
      - "traefik.http.routers.http-3-hhc1afp29any1kulfucplz13.rule=Host(`www.arka11.co`) && PathPrefix(`/`)"
      - traefik.http.routers.http-3-hhc1afp29any1kulfucplz13.service=http-3-hhc1afp29any1kulfucplz13
      - traefik.http.routers.https-2-hhc1afp29any1kulfucplz13.entryPoints=https
      - traefik.http.routers.https-2-hhc1afp29any1kulfucplz13.middlewares=arka-to-aluna
      - "traefik.http.routers.https-2-hhc1afp29any1kulfucplz13.rule=Host(`arka11.co`) && PathPrefix(`/`)"
      - traefik.http.routers.https-2-hhc1afp29any1kulfucplz13.service=https-2-hhc1afp29any1kulfucplz13
      - traefik.http.routers.https-2-hhc1afp29any1kulfucplz13.tls.certresolver=letsencrypt
      - traefik.http.routers.https-2-hhc1afp29any1kulfucplz13.tls=true
      - traefik.http.routers.https-3-hhc1afp29any1kulfucplz13.entryPoints=https
      - traefik.http.routers.https-3-hhc1afp29any1kulfucplz13.middlewares=arka-to-aluna
      - "traefik.http.routers.https-3-hhc1afp29any1kulfucplz13.rule=Host(`www.arka11.co`) && PathPrefix(`/`)"
      - traefik.http.routers.https-3-hhc1afp29any1kulfucplz13.service=https-3-hhc1afp29any1kulfucplz13
      - traefik.http.routers.https-3-hhc1afp29any1kulfucplz13.tls.certresolver=letsencrypt
      - traefik.http.routers.https-3-hhc1afp29any1kulfucplz13.tls=true
      - traefik.http.services.http-2-hhc1afp29any1kulfucplz13.loadbalancer.server.port=3000
      - traefik.http.services.http-3-hhc1afp29any1kulfucplz13.loadbalancer.server.port=3000
      - traefik.http.services.https-2-hhc1afp29any1kulfucplz13.loadbalancer.server.port=3000
      - traefik.http.services.https-3-hhc1afp29any1kulfucplz13.loadbalancer.server.port=3000

networks:
  coolify:
    external: true
    name: coolify
