<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; font-family: 'Montserrat', sans-serif; overflow: hidden; }
  /* Cover slide */
  .cover { width: 100%; height: 100%; background: #110d3f; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 80px; }
  .cover.active { display: flex; }
  .cover img { height: 50px; margin-bottom: 40px; }
  .cover .topic { color: #ffcd07; font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }
  .cover h1 { color: #fff; font-size: 48px; font-weight: 800; line-height: 1.2; }
  .cover .page { color: rgba(255,255,255,0.4); font-size: 16px; margin-top: 40px; }
  /* Content slide */
  .content-slide { width: 100%; height: 100%; background: #ffffff; display: none; flex-direction: column; padding: 80px; }
  .content-slide.active { display: flex; }
  .content-slide .number { color: #ffcd07; font-size: 80px; font-weight: 800; line-height: 1; margin-bottom: 20px; }
  .content-slide h2 { color: #110d3f; font-size: 36px; font-weight: 800; margin-bottom: 20px; }
  .content-slide p { color: #444; font-size: 24px; line-height: 1.5; flex: 1; }
  .content-slide .bottom-bar { display: flex; justify-content: space-between; align-items: center; padding-top: 30px; border-top: 2px solid #f0f0f0; }
  .content-slide .brand { color: #110d3f; font-size: 16px; font-weight: 700; }
  .content-slide .page { color: #999; font-size: 14px; }
  /* CTA slide */
  .cta { width: 100%; height: 100%; background: #110d3f; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 80px; }
  .cta.active { display: flex; }
  .cta img { height: 60px; margin-bottom: 30px; }
  .cta h2 { color: #fff; font-size: 36px; font-weight: 800; margin-bottom: 16px; }
  .cta p { color: rgba(255,255,255,0.7); font-size: 22px; margin-bottom: 30px; }
  .cta .btn { background: #ffcd07; color: #110d3f; font-size: 20px; font-weight: 700; padding: 14px 36px; border-radius: 8px; }
</style>
</head>
<body>
<div class="cover" id="coverSlide">
  <img id="coverLogo" src="">
  <div class="topic" id="coverTopic"></div>
  <h1 id="coverTitle"></h1>
  <div class="page" id="coverPage"></div>
</div>
<div class="content-slide" id="contentSlide">
  <div class="number" id="contentNumber"></div>
  <h2 id="contentTitle"></h2>
  <p id="contentText"></p>
  <div class="bottom-bar">
    <span class="brand">hayexperiencia.com</span>
    <span class="page" id="contentPage"></span>
  </div>
</div>
<div class="cta" id="ctaSlide">
  <img id="ctaLogo" src="">
  <h2 id="ctaTitle">Siguenos para mas tips</h2>
  <p id="ctaText">@hayexperiencia</p>
  <div class="btn">hayexperiencia.com</div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const data = JSON.parse(decodeURIComponent(params.get('data') || '{}'));
  const slideType = data.slideType || 'cover';
  document.querySelectorAll('.cover, .content-slide, .cta').forEach(el => el.classList.remove('active'));
  if (slideType === 'cover') {
    const el = document.getElementById('coverSlide'); el.classList.add('active');
    document.getElementById('coverLogo').src = data.logo || '';
    document.getElementById('coverTopic').textContent = data.topic || '';
    document.getElementById('coverTitle').textContent = data.title || '';
    document.getElementById('coverPage').textContent = data.pageIndicator || '';
  } else if (slideType === 'content') {
    const el = document.getElementById('contentSlide'); el.classList.add('active');
    document.getElementById('contentNumber').textContent = data.number || '';
    document.getElementById('contentTitle').textContent = data.title || '';
    document.getElementById('contentText').textContent = data.text || '';
    document.getElementById('contentPage').textContent = data.pageIndicator || '';
  } else if (slideType === 'cta') {
    const el = document.getElementById('ctaSlide'); el.classList.add('active');
    document.getElementById('ctaLogo').src = data.logo || '';
    document.getElementById('ctaTitle').textContent = data.ctaTitle || 'Siguenos para mas tips';
    document.getElementById('ctaText').textContent = data.ctaText || '@hayexperiencia';
  }
</script>
</body>
</html>
