<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 628px; font-family: 'Montserrat', sans-serif; overflow: hidden; }
  .container { width: 100%; height: 100%; position: relative; }
  .bg-image { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
  .gradient { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(17,13,63,0.92) 0%, rgba(17,13,63,0.4) 60%, transparent 100%); }
  .content { position: absolute; top: 50px; left: 60px; bottom: 50px; width: 500px; display: flex; flex-direction: column; justify-content: center; }
  .logo { height: 40px; margin-bottom: 24px; }
  .badge { display: inline-block; background: #ffcd07; color: #110d3f; font-size: 18px; font-weight: 700; padding: 6px 16px; border-radius: 6px; margin-bottom: 16px; width: fit-content; }
  .price { color: #ffffff; font-size: 48px; font-weight: 800; line-height: 1.1; margin-bottom: 10px; }
  .title { color: #ffffff; font-size: 24px; font-weight: 600; margin-bottom: 6px; }
  .location { color: rgba(255,255,255,0.8); font-size: 18px; margin-bottom: 20px; }
  .specs { display: flex; gap: 24px; }
  .spec { color: #ffffff; font-size: 16px; font-weight: 600; background: rgba(255,255,255,0.15); padding: 8px 16px; border-radius: 6px; }
  .spec span { color: #ffcd07; }
</style>
</head>
<body>
<div class="container">
  <img class="bg-image" id="bgImage" src="" alt="">
  <div class="gradient"></div>
  <div class="content">
    <img class="logo" id="logo" src="" alt="Hay Experiencia">
    <div class="badge" id="badge">Venta</div>
    <div class="price" id="price"></div>
    <div class="title" id="title"></div>
    <div class="location" id="location"></div>
    <div class="specs">
      <div class="spec" id="specArea"></div>
      <div class="spec" id="specBed"></div>
      <div class="spec" id="specBath"></div>
    </div>
  </div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const data = JSON.parse(decodeURIComponent(params.get('data') || '{}'));
  document.getElementById('bgImage').src = data.image || '';
  document.getElementById('logo').src = data.logo || '';
  document.getElementById('badge').textContent = data.transactionType || 'Venta';
  document.getElementById('price').textContent = data.price || '';
  document.getElementById('title').textContent = data.title || '';
  document.getElementById('location').textContent = data.location || '';
  document.getElementById('specArea').innerHTML = data.area ? `<span>${data.area}</span> m2` : '';
  document.getElementById('specBed').innerHTML = data.bedrooms ? `<span>${data.bedrooms}</span> Hab` : '';
  document.getElementById('specBath').innerHTML = data.bathrooms ? `<span>${data.bathrooms}</span> Banos` : '';
</script>
</body>
</html>
