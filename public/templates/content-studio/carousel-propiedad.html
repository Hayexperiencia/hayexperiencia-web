<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; font-family: 'Montserrat', sans-serif; overflow: hidden; }
  /* Slide 0: Cover */
  .cover { width: 100%; height: 100%; position: relative; display: none; }
  .cover.active { display: block; }
  .cover .bg { width: 100%; height: 100%; object-fit: cover; position: absolute; }
  .cover .overlay { position: absolute; inset: 0; background: linear-gradient(transparent 30%, rgba(17,13,63,0.95)); }
  .cover .text { position: absolute; bottom: 60px; left: 50px; right: 50px; }
  .cover .badge { display: inline-block; background: #ffcd07; color: #110d3f; font-size: 20px; font-weight: 700; padding: 8px 20px; border-radius: 6px; margin-bottom: 16px; }
  .cover .price { color: #fff; font-size: 52px; font-weight: 800; margin-bottom: 10px; }
  .cover .title { color: #fff; font-size: 26px; font-weight: 600; }
  .cover .logo-top { position: absolute; top: 30px; left: 40px; height: 45px; }
  .cover .page-indicator { position: absolute; top: 30px; right: 40px; color: rgba(255,255,255,0.7); font-size: 16px; font-weight: 600; }
  /* Slide 1+: Photo slides */
  .photo-slide { width: 100%; height: 100%; position: relative; display: none; }
  .photo-slide.active { display: block; }
  .photo-slide img { width: 100%; height: 100%; object-fit: cover; }
  .photo-slide .caption { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(17,13,63,0.85); padding: 24px 40px; }
  .photo-slide .caption-text { color: #fff; font-size: 20px; font-weight: 600; }
  .photo-slide .page-indicator { position: absolute; top: 30px; right: 40px; color: rgba(255,255,255,0.7); font-size: 16px; font-weight: 600; background: rgba(17,13,63,0.5); padding: 6px 14px; border-radius: 6px; }
  /* Slide final: CTA */
  .cta-slide { width: 100%; height: 100%; background: #110d3f; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 60px; }
  .cta-slide.active { display: flex; }
  .cta-slide img { height: 60px; margin-bottom: 40px; }
  .cta-slide h2 { color: #fff; font-size: 40px; font-weight: 800; margin-bottom: 16px; }
  .cta-slide p { color: rgba(255,255,255,0.7); font-size: 22px; margin-bottom: 40px; }
  .cta-slide .btn { background: #ffcd07; color: #110d3f; font-size: 22px; font-weight: 700; padding: 16px 40px; border-radius: 10px; }
</style>
</head>
<body>
<!-- Slide index is passed as ?slide=0,1,2... Each render produces one slide -->
<div class="cover active" id="coverSlide">
  <img class="bg" id="coverBg" src="">
  <div class="overlay"></div>
  <img class="logo-top" id="coverLogo" src="">
  <span class="page-indicator" id="coverPage">1/5</span>
  <div class="text">
    <div class="badge" id="coverBadge">Venta</div>
    <div class="price" id="coverPrice"></div>
    <div class="title" id="coverTitle"></div>
  </div>
</div>
<div class="photo-slide" id="photoSlide">
  <img id="photoImg" src="">
  <span class="page-indicator" id="photoPage">2/5</span>
  <div class="caption"><span class="caption-text" id="photoCaption"></span></div>
</div>
<div class="cta-slide" id="ctaSlide">
  <img id="ctaLogo" src="">
  <h2>Te interesa?</h2>
  <p id="ctaText">Escribe al 573022343659</p>
  <div class="btn">hayexperiencia.com</div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const data = JSON.parse(decodeURIComponent(params.get('data') || '{}'));
  const slideType = data.slideType || 'cover'; // cover, photo, cta
  document.querySelectorAll('.cover, .photo-slide, .cta-slide').forEach(el => el.classList.remove('active'));
  if (slideType === 'cover') {
    document.getElementById('coverSlide').classList.add('active');
    document.getElementById('coverBg').src = data.image || '';
    document.getElementById('coverLogo').src = data.logo || '';
    document.getElementById('coverPage').textContent = data.pageIndicator || '1/5';
    document.getElementById('coverBadge').textContent = data.transactionType || 'Venta';
    document.getElementById('coverPrice').textContent = data.price || '';
    document.getElementById('coverTitle').textContent = data.title || '';
  } else if (slideType === 'photo') {
    document.getElementById('photoSlide').classList.add('active');
    document.getElementById('photoImg').src = data.image || '';
    document.getElementById('photoPage').textContent = data.pageIndicator || '2/5';
    document.getElementById('photoCaption').textContent = data.caption || '';
  } else if (slideType === 'cta') {
    document.getElementById('ctaSlide').classList.add('active');
    document.getElementById('ctaLogo').src = data.logo || '';
    document.getElementById('ctaText').textContent = data.ctaText || 'Escribe al 573022343659';
  }
</script>
</body>
</html>
