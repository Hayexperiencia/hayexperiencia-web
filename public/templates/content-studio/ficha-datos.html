<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; font-family: 'Montserrat', sans-serif; overflow: hidden; background: #ffffff; }
  .container { width: 100%; height: 100%; padding: 50px; display: flex; flex-direction: column; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
  .header img { height: 40px; }
  .ref { color: #110d3f; font-size: 16px; font-weight: 600; opacity: 0.5; }
  .title-section { margin-bottom: 30px; }
  .badge { display: inline-block; background: #ffcd07; color: #110d3f; font-size: 18px; font-weight: 700; padding: 6px 16px; border-radius: 6px; margin-bottom: 12px; }
  .price { color: #110d3f; font-size: 44px; font-weight: 800; margin-bottom: 8px; }
  .title { color: #110d3f; font-size: 22px; font-weight: 600; }
  .location { color: #666; font-size: 18px; margin-top: 4px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; flex: 1; }
  .item { background: #f5f5f7; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; justify-content: center; }
  .item-label { color: #666; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .item-value { color: #110d3f; font-size: 28px; font-weight: 800; }
  .footer { margin-top: 30px; padding-top: 20px; border-top: 2px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
  .footer-text { color: #110d3f; font-size: 16px; font-weight: 600; }
  .footer-url { color: #ffcd07; font-size: 14px; font-weight: 700; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <img id="logo" src="" alt="Hay Experiencia">
    <span class="ref" id="ref"></span>
  </div>
  <div class="title-section">
    <div class="badge" id="badge">Venta</div>
    <div class="price" id="price"></div>
    <div class="title" id="title"></div>
    <div class="location" id="location"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="footer">
    <span class="footer-text">hayexperiencia.com</span>
    <span class="footer-url">573022343659</span>
  </div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const data = JSON.parse(decodeURIComponent(params.get('data') || '{}'));
  document.getElementById('logo').src = data.logo || '';
  document.getElementById('ref').textContent = data.ref ? `Ref: ${data.ref}` : '';
  document.getElementById('badge').textContent = data.transactionType || 'Venta';
  document.getElementById('price').textContent = data.price || '';
  document.getElementById('title').textContent = data.title || '';
  document.getElementById('location').textContent = data.location || '';
  const specs = [
    { label: 'Area', value: data.area ? `${data.area} m2` : '' },
    { label: 'Habitaciones', value: data.bedrooms || '' },
    { label: 'Banos', value: data.bathrooms || '' },
    { label: 'Parqueaderos', value: data.parking || '' },
    { label: 'Estrato', value: data.stratum || '' },
    { label: 'Antiguedad', value: data.age || '' },
  ].filter(s => s.value);
  const grid = document.getElementById('grid');
  specs.forEach(s => {
    grid.innerHTML += `<div class="item"><div class="item-label">${s.label}</div><div class="item-value">${s.value}</div></div>`;
  });
</script>
</body>
</html>
