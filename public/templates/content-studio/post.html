<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; font-family: 'Montserrat', sans-serif; overflow: hidden; }
  .container { width: 100%; height: 100%; position: relative; }
  .bg-image { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
  .overlay { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(17,13,63,0.95)); padding: 60px 50px 50px; }
  .badge { display: inline-block; background: #ffcd07; color: #110d3f; font-size: 22px; font-weight: 700; padding: 8px 20px; border-radius: 6px; margin-bottom: 16px; }
  .price { color: #ffffff; font-size: 56px; font-weight: 800; line-height: 1.1; margin-bottom: 12px; }
  .title { color: #ffffff; font-size: 28px; font-weight: 600; margin-bottom: 8px; }
  .location { color: rgba(255,255,255,0.8); font-size: 22px; font-weight: 400; margin-bottom: 24px; }
  .specs { display: flex; gap: 30px; }
  .spec { color: #ffffff; font-size: 20px; font-weight: 600; }
  .spec span { color: #ffcd07; }
  .logo-bar { position: absolute; top: 30px; left: 40px; right: 40px; display: flex; justify-content: space-between; align-items: center; }
  .logo-bar img { height: 50px; }
  .ref { color: rgba(255,255,255,0.7); font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <img class="bg-image" id="bgImage" src="" alt="">
  <div class="logo-bar">
    <img id="logo" src="" alt="Hay Experiencia">
    <span class="ref" id="ref"></span>
  </div>
  <div class="overlay">
    <div class="badge" id="badge">Venta</div>
    <div class="price" id="price"></div>
    <div class="title" id="title"></div>
    <div class="location" id="location"></div>
    <div class="specs">
      <div class="spec" id="specArea"></div>
      <div class="spec" id="specBed"></div>
      <div class="spec" id="specBath"></div>
      <div class="spec" id="specParking"></div>
    </div>
  </div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const data = JSON.parse(decodeURIComponent(params.get('data') || '{}'));
  document.getElementById('bgImage').src = data.image || '';
  document.getElementById('logo').src = data.logo || '';
  document.getElementById('ref').textContent = data.ref ? `Ref: ${data.ref}` : '';
  document.getElementById('badge').textContent = data.transactionType || 'Venta';
  document.getElementById('price').textContent = data.price || '';
  document.getElementById('title').textContent = data.title || '';
  document.getElementById('location').textContent = data.location || '';
  document.getElementById('specArea').innerHTML = data.area ? `<span>${data.area}</span> m2` : '';
  document.getElementById('specBed').innerHTML = data.bedrooms ? `<span>${data.bedrooms}</span> Hab` : '';
  document.getElementById('specBath').innerHTML = data.bathrooms ? `<span>${data.bathrooms}</span> Banos` : '';
  document.getElementById('specParking').innerHTML = data.parking ? `<span>${data.parking}</span> Parq` : '';
</script>
</body>
</html>
